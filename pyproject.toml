[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Legacy distribution name retained during the NeuraHive v2 migration.
# The canonical v2 distribution will be switched only after the package
# compatibility strategy and PyPI availability have been validated.
name = "agentfactory-studio"
version = "1.2.0"
description = "Universal AI Agent Factory: SDK + self-hosted Studio for building and operating any AI agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "AgentFactory", email = "hello@agentfactory.ai"}]
keywords = ["ai", "agent", "llm", "multi-repo", "fastapi", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "cryptography>=41.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "click>=8.1",
    "requests>=2.32.0",
    "PyJWT>=2.8.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.0",
    "ruff>=0.4.0",
]
gemini = ["langchain-google-genai>=2.0"]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
langfuse = ["langfuse>=2.0"]
search = ["langchain-community>=0.3.0", "duckduckgo-search>=6.0"]
platform = ["uvicorn[standard]>=0.29.0"]
all = [
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langfuse>=2.0",
    "langchain-community>=0.3.0",
    "duckduckgo-search>=6.0",
    "PyJWT>=2.8.0",
]

[project.scripts]
agentfactory = "agentfactory.cli:cli"

[project.urls]
Homepage = "https://github.com/theaaqibjavaid/agent-factory"
Documentation = "https://github.com/theaaqibjavaid/agent-factory/tree/main/docs"
Repository = "https://github.com/theaaqibjavaid/agent-factory"
Issues = "https://github.com/theaaqibjavaid/agent-factory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentfactory*", "neurahive*"]

[tool.setuptools.package-data]
agentfactory = ["py.typed"]
neurahive = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = [
    "agentfactory/app",
    "agentfactory/runtime.py",
    "agentfactory/terminal.py",
    "agentfactory/validation.py",
    "agentfactory/custom_tools.py",
]
omit = ["agentfactory/app/approval_server.py"]

[tool.coverage.report]
fail_under = 80

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
