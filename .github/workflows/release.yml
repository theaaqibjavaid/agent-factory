name: Release

# Publishes the `agentfactory` wheel to PyPI when a version tag (v*) is pushed.
# Uses PyPI trusted publishing (OIDC) — no stored passwords/tokens.
# Setup (one time): in PyPI project settings add a "GitHub" pending publisher
# with owner = theaaqibjavaid, repository = agent-factory,
# workflow file = release.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read   # checkout needs read access to the repository
  id-token: write  # required for PyPI trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Smoke-test the wheel before publishing
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/agentfactory --version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify the published version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          pip install --index-url https://pypi.org/simple/ --quiet --force-reinstall "agentfactory-studio==${TAG}"
          python -c "import agentfactory; assert agentfactory.__version__ == '${TAG}', (agentfactory.__version__, '${TAG}')"
          echo "Published agentfactory-studio ${TAG} verified on PyPI."
